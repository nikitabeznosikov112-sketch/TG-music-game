<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .modal { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .btn { padding: 10px 20px; text-decoration: none; border-radius: 4px; color: white; font-weight: bold; margin: 0 10px; display: inline-block; }
        .btn-danger { background: #e74c3c; }
        .btn-cancel { background: #95a5a6; }
    </style>
</head>
<body>
    <div class="modal">
        <h2>WARNING</h2>
        <p>ARE YOU WANT TO CHANGE SCORE<b>{{ user.name }}</b>(ID: {{ user.id }})?</p>

        <form action="/admin/change_score/{{ user.tg_id }}" method="POST" style='display:inline;'>
            <input type="number", name="score", placeholder="Enter new score" required>
            <button type="submit">CHANGE SCORE</button>
        </form>
        
        <a href="/admin" class="btn btn-cancel">Cancel</a>
    </div>
</body>
</html>
